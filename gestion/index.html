<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow"><title>Gestion — Side by Side</title><style>
/* Layout : coquille d'appli mobile centrée (780px max), en-tête collant, barre d'onglets fixe en bas, feuilles modales */
/* Charte Side by Side : fond noir marine, or prestige, ivoire, cuivre. Noir par défaut, thème ivoire en option. */
:root{
  --bg:#060D1F;--surface:#0C1630;--surface-2:#13203F;--fg:#F7F5F0;--muted:#A3ABC0;--line:#22305A;
  --accent:#D4AF37;--accent-ink:#0B132B;--accent-soft:#2A2310;
  --gold:#D4AF37;--gold-soft:#241E0E;--copper:#B07A4F;
  --ok:#5BD08A;--ok-soft:#132E1E;--warn:#F0A64B;--warn-soft:#33230E;--bad:#FF7A6E;--bad-soft:#3A1512;--info:#86AAF2;--info-soft:#152240;
  --scrim:rgba(0,0,0,.7);--shadow:0 14px 36px rgba(0,0,0,.6);--glow:0 0 0 1px rgba(212,175,55,.35);
  --f-brand:'Cinzel',Georgia,'Times New Roman',serif;
  --f-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --f-body:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F7F5F0;--surface:#FFFFFF;--surface-2:#EFEADF;--fg:#0B132B;--muted:#5E6170;--line:#E0D8C6;
  --accent:#8C6A12;--accent-ink:#FFFFFF;--accent-soft:#F3E8C8;
  --gold:#8C6A12;--gold-soft:#F3E8C8;--copper:#8B5E3C;
  --ok:#1E7A3C;--ok-soft:#DDF1E3;--warn:#975800;--warn-soft:#FBEBD2;--bad:#B3261E;--bad-soft:#FBE2DF;--info:#2B57AD;--info-soft:#DEE7F8;
  --scrim:rgba(11,19,43,.45);--shadow:0 12px 32px rgba(11,19,43,.14);--glow:0 0 0 1px rgba(140,106,18,.3);color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:0;text-wrap:balance;margin:0}
h1{font-family:var(--f-brand);font-weight:600;font-size:clamp(2.3rem,9vw,3.8rem);line-height:1;letter-spacing:.04em;color:var(--gold)}
h2{font-size:1.8rem;line-height:1.1}
h3{font-size:1.32rem;line-height:1.15}
p{margin:0}
.muted{color:var(--muted)}.sm{font-size:.84rem}.xs{font-size:.76rem}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.lbl{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:14px;padding-block:18px}
/* en-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:10px}
.top-in .brand{flex:1 1 170px;min-width:0}
.tools{display:flex;gap:8px;align-items:center;margin-inline-start:auto}
.brand{font-family:var(--f-brand);font-weight:600;font-size:1.12rem;letter-spacing:.08em;color:var(--gold)}
.brand small{display:block;font-family:var(--f-body);font-family:var(--f-body);font-weight:600;font-size:.66rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;height:36px;min-width:36px;padding:0 9px;display:inline-grid;place-items:center;cursor:pointer;font:600 .8rem var(--f-body)}
.iconbtn svg{width:18px;height:18px}
.badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:99px;font:700 .66rem var(--f-body);min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
select.lang{width:auto;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .8rem var(--f-body);padding:0 6px}
.demo{background:var(--gold-soft);color:var(--fg);border-bottom:1px solid var(--line);font-size:.78rem}
.demo .wrap{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;padding-block:6px}
.demo b{color:var(--gold)}
/* boutons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:700 .86rem var(--f-body);padding:9px 14px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:linear-gradient(180deg,#E6C766,var(--accent));border-color:var(--accent);color:var(--accent-ink)}
:root[data-theme="light"] .btn.pri{background:var(--accent)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.sos{background:var(--bad);border-color:var(--bad);color:#fff;letter-spacing:.06em}
.btn.dm{border-style:dashed;color:var(--gold);background:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.full{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* puces */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font:700 .72rem var(--f-body);white-space:nowrap;max-width:100%}
.row>.pill,.bk-h>.pill{white-space:normal;line-height:1.25;text-align:center}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-bad{background:var(--bad-soft);color:var(--bad)}.t-info{background:var(--info-soft);color:var(--info)}.t-accent{background:var(--accent-soft);color:var(--accent)}.t-muted{background:var(--surface-2);color:var(--muted)}.t-gold{background:var(--gold-soft);color:var(--gold)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:.76rem;font-weight:600;color:var(--muted);background:var(--surface)}
.chip.gold{border-color:transparent;background:var(--gold-soft);color:var(--gold)}
.chip.fict{border-style:dashed}
/* cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.note{border-radius:12px;padding:10px 12px;font-size:.84rem}
/* accueil */
.hero{padding-block:34px 10px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{font:700 .72rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero{border-bottom:1px solid var(--line);padding-bottom:26px}
.hero p{max-width:56ch;color:var(--muted);font-size:1.02rem}
.spaces{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.space{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;font:inherit;color:inherit}
.space:hover{border-color:var(--accent);box-shadow:var(--glow)}
.mono{width:76px;height:76px;border-radius:20px;background:#0B132B;border:1px solid rgba(212,175,55,.6);display:grid;place-items:center}
.mono span{font:600 2.6rem/1 var(--f-brand);color:#D4AF37}
.byline{display:flex;align-items:center;gap:10px;font:600 .74rem var(--f-body);letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
.byline::before,.byline::after{content:"";height:1px;width:32px;background:var(--gold)}
.space .k{font:700 .7rem var(--f-mono);color:var(--accent);letter-spacing:.1em}
/* filtres + grille */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.fl{font-size:.74rem;font-weight:700;color:var(--muted)}
input,select,textarea{font:500 .92rem var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.pcard{padding:0;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column}
.pcard .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.ph{position:relative;aspect-ratio:4/5;max-width:100%;width:100%;background:radial-gradient(110% 80% at 30% 15%,hsl(var(--h) 30% 34%),#121620 62%,#07090E);display:flex;align-items:flex-end;padding:12px;color:#D4AF37;border-bottom:1px solid rgba(212,175,55,.35)}
.ph>svg{position:absolute;inset:0;width:100%;height:100%}
.ph .pt,.ph .vf{z-index:1}
.mini svg{width:100%;height:100%;display:block}
.ph .pt{position:absolute;top:10px;left:10px;background:#D4AF37;color:#0B132B;font:700 .66rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:99px}
.ph .vf{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.45);font:700 .64rem var(--f-body);padding:4px 8px;border-radius:99px}
.ph.wide{aspect-ratio:16/10}
.mini{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#D4AF37;font:600 1.05rem var(--f-brand);overflow:hidden;background:radial-gradient(circle at 30% 25%,hsl(var(--h) 30% 32%),#0B0E16);border:1px solid rgba(212,175,55,.5)}
.stars{color:var(--gold);font-weight:700;font-size:.84rem}
/* réservations */
.bk{display:flex;flex-direction:column;gap:12px}
.bk-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;row-gap:6px}
.bk-h>*{min-width:0}
.bk-m{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px;font-size:.88rem}
.bk-m>div{min-width:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.code{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.code .num{font-size:1.5rem;letter-spacing:.18em;color:var(--accent)}
.price{width:100%;border-collapse:collapse;font-size:.88rem}
.price td{padding:6px 0;border-bottom:1px solid var(--line)}
.price td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.price tr.tot td{font-weight:700;border-bottom:0;font-size:1rem}
.price tr.pay td{color:var(--muted);border-bottom:0}
.tl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:0}
.tl li{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:10px;position:relative}
.tl li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px}
.tl li::after{content:"";position:absolute;left:4px;top:16px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .num{font-size:1.35rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:.84rem;min-width:520px}
table.t th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
/* onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:flex;justify-content:space-around;gap:2px}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font:700 .68rem var(--f-body);padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:min(.68rem,2.3vw);letter-spacing:-.01em}
html.comfort .tabs button span{font-size:min(.68rem,1.9vw)}
/* Barre du bas : se cache quand on fait défiler vers le bas, réapparaît en remontant */
.tabs{transition:transform .25s ease}
html.navhide .tabs{transform:translateY(calc(100% + 2px))}
@media (prefers-reduced-motion:reduce){.tabs{transition:none}}
main{padding-bottom:96px}
/* feuilles */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim.full{align-items:stretch;background:var(--bg)}.sheet.full{max-height:none;height:100%;border-radius:0;box-shadow:none;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.xhero{aspect-ratio:16/10;border-radius:16px;overflow:hidden;border:1px solid rgba(212,175,55,.35)}
.faceid{width:132px;height:132px;border-radius:32px;border:1.5px solid var(--gold);background:var(--gold-soft);display:grid;place-items:center;cursor:pointer;margin:8px auto 0;transition:transform .2s}
.faceid svg{width:72px;height:72px;fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.faceid.scan{animation:fidpulse 1s ease-in-out infinite}.faceid .ok{stroke:var(--ok);stroke-width:4}
@keyframes fidpulse{50%{transform:scale(.94);box-shadow:0 0 0 10px var(--gold-soft)}}
@media (prefers-reduced-motion:reduce){.faceid.scan{animation:none}}
.lockpage{align-items:center;text-align:center}
.pchips{display:flex;flex-wrap:wrap;gap:6px}.pchip{border:1px solid var(--line);background:var(--surface);color:inherit;font:inherit;font-size:.8rem;padding:6px 10px;border-radius:99px;cursor:pointer;text-align:left}.pchip:hover{border-color:var(--gold)}
.refcode{font-size:1.15rem;letter-spacing:.08em;color:var(--gold);padding:10px 12px;border:1px dashed var(--gold);border-radius:10px;min-width:0}
.acts a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.legalbtn{justify-content:space-between;text-align:left;width:100%}
.legaldoc{display:flex;flex-direction:column;gap:6px;font-size:.92rem;line-height:1.55}.legaldoc h3{font-size:1.05rem;margin-top:12px;color:var(--gold)}.legaldoc ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}.legaldoc p{margin:0}
.forwho .prochebox{display:none}.forwho:has(input[value=proche]:checked) .prochebox{display:flex}
.seg2{display:flex;flex-wrap:wrap;gap:8px}.seg2 label{flex:1 1 120px;cursor:pointer}.seg2 input{position:absolute;opacity:0;pointer-events:none}.seg2 span{display:block;text-align:center;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;font-weight:600;font-size:.9rem}.seg2 input:checked+span{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}.seg2 input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.report{border-color:rgba(212,175,55,.45)}
.switch{position:relative;flex:none;width:52px;height:30px;cursor:pointer}.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--fg);transition:transform .2s}.switch input:checked+span{background:var(--gold)}.switch input:checked+span::after{transform:translateX(22px);background:#0B132B}.switch input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.aplus{min-height:40px;padding:6px 12px;white-space:nowrap}
html.comfort body{zoom:1.18}html.comfort .muted,html.comfort .xs.muted{color:var(--fg)}html.comfort .xs{font-size:.85rem}
html.comfort .assist,html.comfort .h-exp{display:none}
.placebox{min-height:92px;resize:vertical}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet-h{display:flex;align-items:flex-start;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.88rem;max-width:min(92vw,520px);box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;padding:4px}
.msg{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:.9rem;overflow-wrap:anywhere}
.msg .mt{display:block;font-size:.64rem;opacity:.62;margin-top:3px;text-align:right}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.msg.sys{align-self:center;background:var(--warn-soft);border-color:transparent;font-size:.78rem;max-width:95%}
.rate{display:flex;gap:6px}
.rate label{cursor:pointer}
.rate input{position:absolute;opacity:0}
.rate span{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:700 1rem var(--f-mono)}
.rate input:checked+span{background:var(--gold-soft);color:var(--gold);border-color:var(--gold)}
.rate input:focus-visible+span{outline:2px solid var(--accent)}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:.8rem;font-weight:600;background:var(--surface)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
/* Connexion + boutons premium */
:root{--btn-bg:#13224A;--btn-line:rgba(212,175,55,.42);--btn-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 6px 16px rgba(0,0,0,.35);--pri-shadow:0 8px 22px rgba(212,175,55,.28)}
:root[data-theme="light"]{--btn-bg:#FFFFFF;--btn-line:#CDB57A;--btn-shadow:0 1px 2px rgba(11,19,43,.08),0 4px 12px rgba(11,19,43,.08);--pri-shadow:0 6px 16px rgba(140,106,18,.25)}
.btn{min-height:44px;padding:10px 16px;font-size:.9rem;background:var(--btn-bg);border:1px solid var(--btn-line);box-shadow:var(--btn-shadow);transition:border-color .15s,color .15s,transform .1s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn:active{transform:translateY(1px)}
.btn.pri{box-shadow:var(--pri-shadow)}.btn.pri:hover{color:var(--accent-ink)}
.btn.ghost{background:var(--gold-soft);border-color:transparent;color:var(--gold);box-shadow:none;padding-inline:14px}
.btn.ghost:hover{border-color:var(--btn-line)}
.btn.bad{border-color:rgba(255,122,110,.45);box-shadow:var(--btn-shadow)}
.btn.sos{box-shadow:0 8px 22px rgba(179,38,30,.35)}
.btn.dm{box-shadow:none}
.btn.xs{min-height:36px;padding:7px 12px;font-size:.8rem}
.btn.big{min-height:62px;padding:12px 18px;justify-content:space-between;font-size:1rem;border-radius:14px}
.btn.big .bt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start}.btn.big small{font-weight:600;font-size:.78rem;opacity:.8}
.iconbtn{height:40px;min-width:40px;background:var(--btn-bg);border-color:var(--btn-line);box-shadow:var(--btn-shadow)}
.iconbtn:hover{border-color:var(--gold);color:var(--gold)}
select.lang{height:40px;background:var(--btn-bg);border-color:var(--btn-line)}

/* ===== V2.9 : écran d'accueil animé, connexion, inscription en 3 étapes, recherche, Mon compte, ergonomie mobile ===== */
#sbs-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 35%,#13244A 0%,#0B1730 45%,#060D1F 100%);transition:opacity .5s ease,visibility .5s}
#sbs-splash.out{opacity:0;visibility:hidden}
#sbs-splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:10px;animation:spRise .9s cubic-bezier(.2,.7,.2,1) both}
#sbs-splash .sp-mark{width:104px;height:104px;border-radius:28px;display:grid;place-items:center;border:1.5px solid rgba(212,175,106,.75);box-shadow:0 0 0 8px rgba(212,175,106,.06),0 18px 44px rgba(0,0,0,.45)}
#sbs-splash .sp-mark svg{width:64px;height:64px;fill:#D4AF6A}
#sbs-splash .sp-name{font-family:var(--f-display,Georgia,serif);letter-spacing:.32em;color:#D4AF6A;font-size:1.45rem;margin-top:12px;padding-left:.32em}
#sbs-splash .sp-by{font-family:var(--f-display,Georgia,serif);font-style:italic;color:#E9D7AE;opacity:.85}
#sbs-splash .sp-line{width:0;height:1px;background:linear-gradient(90deg,transparent,#D4AF6A,transparent);animation:spLine 1s .35s ease forwards;margin-top:10px}
@keyframes spRise{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes spLine{to{width:150px}}
@media (prefers-reduced-motion:reduce){#sbs-splash .sp-in,#sbs-splash .sp-line{animation:none}#sbs-splash .sp-line{width:150px}}
