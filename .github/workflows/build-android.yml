# Compilation automatique de l'application Android à chaque envoi sur GitHub.
# Le fichier .apk à installer apparaît dans l'onglet « Actions » > dernier passage > « Artifacts ».
name: Android (test)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android || true
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#060D1F' --splashBackgroundColor '#060D1F'
      - run: node scripts/android-permissions.mjs
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: side-by-side-android, path: android/app/build/outputs/apk/debug/app-debug.apk }
