# Tests d'intégration du serveur : base Supabase locale + fonctions serveur + Stripe simulé (stripe-mock).
# Aucune donnée de production, aucune transaction réelle.
name: Tests serveur (sécurité, paiements, concurrence)
on: [push, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Démarrer Supabase en local (toutes les migrations appliquées)
        working-directory: serveur
        run: |
          [ -f supabase/config.toml ] || supabase init --force
          # Double authentification TOTP (activée par défaut sur les projets Supabase hébergés)
          for CFG in $(find supabase -maxdepth 1 -name 'config.*'); do
            perl -0pi -e 's/(totp\W*\{[^}]*?)enroll_enabled(\W*)false/$1enroll_enabled$2true/s; s/(totp\W*\{[^}]*?)verify_enabled(\W*)false/$1verify_enabled$2true/s; s/(totp\W*\{[^}]*?)enrollEnabled(\W*)false/$1enrollEnabled$2true/s; s/(totp\W*\{[^}]*?)verifyEnabled(\W*)false/$1verifyEnabled$2true/s' "$CFG"
            echo "configuration : $CFG"; grep -n -i -A4 'totp' "$CFG" | head -12
          done
          supabase start -x studio,imgproxy,vector,logflare,supavisor,postgres-meta,mailpit
          supabase status -o env > ../tests/.sb.env
      - name: Démarrer le serveur Stripe simulé et les fonctions serveur
        run: |
          NET=$(docker network ls --format '{{.Name}}' | grep supabase_network | head -1)
          docker run -d --name stripemock --network "$NET" -p 12111:12111 stripe/stripe-mock:latest
          cat > tests/.env.functions <<EOT
          STRIPE_SECRET_KEY=sk_test_123
          STRIPE_API_HOST=stripemock
          STRIPE_API_PORT=12111
          STRIPE_WEBHOOK_SECRET=whsec_test_integration_side_by_side
          INTERNAL_KEY=cle-interne-de-test-tres-longue-123456
          APP_ORIGIN=https://sidebyside.example
          TAX_ALLOW_CURRENT_YEAR=1
          EOT
          sed -i 's/^ *//' tests/.env.functions
          cd serveur && (supabase functions serve --env-file ../tests/.env.functions --no-verify-jwt > ../tests/functions.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/sweeper | grep -q 403 && break; sleep 3; done
      - name: Lancer les tests
        working-directory: tests
        run: |
          set -o pipefail
          set -a; . ./.sb.env; set +a
          npm init -y >/dev/null && npm i --silent @supabase/supabase-js@2.45.4 stripe@14.25.0
          SB_URL=$API_URL SB_ANON=$ANON_KEY SB_SERVICE=$SERVICE_ROLE_KEY INTERNAL_KEY=cle-interne-de-test-tres-longue-123456 STRIPE_WEBHOOK_SECRET=whsec_test_integration_side_by_side \
            node integration.mjs | tee resultats.txt
      - uses: denoland/setup-deno@v2
        if: always()
        with: { deno-version: v2.x }
      - name: Tests unitaires du fichier DAC7 (société, TVA, comptes rendus officiels)
        if: always()
        run: set -o pipefail; SUPABASE_URL=http://localhost SUPABASE_SERVICE_ROLE_KEY=x deno test --node-modules-dir=none --allow-env --allow-net --allow-read --allow-write --allow-import tests/dpi_test.ts 2>&1 | tee tests/resultats-dpi.txt
      - name: Tests unitaires des e-mails Side by Side
        if: always()
        run: set -o pipefail; deno test --node-modules-dir=none --allow-env --allow-read tests/mailer_test.ts 2>&1 | tee tests/resultats-mailer.txt
      - name: Validation du XML DAC7 contre le schéma officiel OCDE DPI v1.0
        if: always()
        run: |
          set -o pipefail
          sudo apt-get install -y -qq libxml2-utils >/dev/null
          mkdir -p xsd && cd xsd
          for f in dpixml_v1.0.xsd oecddpitypes_v1.0.xsd isodpitypes_v1.0.xsd; do curl -sSfL -o $f https://www.vero.fi/contentassets/c3dcde0af9374153aada7e6c63f4cfcc/$f; done
          xmllint --noout --schema dpixml_v1.0.xsd ../tests/dac7-exemple-ocde.xml ../tests/dac7-exemple-entite-ocde.xml 2>&1 | tee ../tests/resultats-xsd.txt
      - name: Test des origines autorisées (CORS)
        if: always()
        run: set -o pipefail; SUPABASE_URL=http://localhost SUPABASE_SERVICE_ROLE_KEY=x APP_ORIGIN=https://sidebyside.example deno test --node-modules-dir=none --allow-env --allow-net --allow-read --allow-import tests/cors_test.ts 2>&1 | tee tests/resultats-cors.txt
      - name: Vérification des types de toutes les fonctions serveur (TypeScript)
        if: always()
        continue-on-error: true
        run: set -o pipefail; cd serveur/supabase/functions && deno check --node-modules-dir=none --allow-import */index.ts 2>&1 | grep -v Download | tee ../../../tests/resultats-types.txt
      - name: Résumé
        if: always()
        run: |
          echo '## Résultats des tests serveur' >> $GITHUB_STEP_SUMMARY
          cat tests/resultats.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '### Journal des fonctions (fin)' >> $GITHUB_STEP_SUMMARY
          tail -60 tests/functions.log | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-tests-serveur
          path: |
            tests/resultats*.*
            tests/dac7-exemple-*.xml
