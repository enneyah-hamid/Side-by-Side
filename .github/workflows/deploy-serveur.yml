# Déploiement des fonctions serveur sur le projet Supabase « Side by Side » (production).
# Ne s'exécute qu'après la réussite des tests serveur, et seulement si le secret SUPABASE_ACCESS_TOKEN existe.
name: Déploiement des fonctions serveur
on:
  workflow_run:
    workflows: ["Tests serveur (sécurité, paiements, concurrence)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.CODE }}
      PROJECT: xaogettvtlhfejnvmowk
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
      APPLE_SECRET: ${{ secrets.APPLE_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Déployer
        working-directory: serveur
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Secret SUPABASE_ACCESS_TOKEN absent : déploiement ignoré."; exit 0; fi
          for f in supabase/functions/*/; do
            n=$(basename "$f"); [ "$n" = "_shared" ] && continue
            case "$n" in stripe-webhook|release-payout|sweeper|monthly-invoice|admin-auth) flag="--no-verify-jwt";; *) flag="";; esac
            echo "→ $n $flag"; for t in 1 2 3; do npx -y supabase@2 functions deploy "$n" --project-ref "$PROJECT" --use-api $flag && break; [ $t = 3 ] && exit 1; echo "Nouvel essai dans 20 s (erreur passagère)…"; sleep 20; done
          done
      - name: Clé d'envoi des e-mails pour les fonctions serveur (si le secret RESEND_API_KEY existe)
        working-directory: serveur
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$RESEND_API_KEY" ]; then echo "Envoi d'e-mails non configuré."; exit 0; fi
          npx -y supabase@2 secrets set RESEND_API_KEY="$RESEND_API_KEY" MAIL_FROM="Side by Side <${MAIL_FROM_ADDRESS:-no-reply@zyntell.fr}>" --project-ref "$PROJECT" >/dev/null && echo "Clé Resend enregistrée pour les fonctions serveur."
      - name: Réglages de connexion (liens de retour, e-mails Side by Side, Google, Apple)
        run: node scripts/auth-config.mjs
