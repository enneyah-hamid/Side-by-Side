# Déploiement des fonctions serveur sur le projet Supabase « Side by Side » (production).
# Ne s'exécute qu'après la réussite des tests serveur, et seulement si le secret SUPABASE_ACCESS_TOKEN existe.
name: Déploiement des fonctions serveur
on:
  workflow_run:
    workflows: ["Tests serveur (sécurité, paiements, concurrence)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT: xaogettvtlhfejnvmowk
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Déployer
        working-directory: serveur
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Secret SUPABASE_ACCESS_TOKEN absent : déploiement ignoré."; exit 0; fi
          for f in supabase/functions/*/; do
            n=$(basename "$f"); [ "$n" = "_shared" ] && continue
            case "$n" in stripe-webhook|release-payout|sweeper|monthly-invoice) flag="--no-verify-jwt";; *) flag="";; esac
            echo "→ $n $flag"; npx -y supabase@2 functions deploy "$n" --project-ref "$PROJECT" --use-api $flag
          done
